<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="kds-manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700;800;900&family=Mukta:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/kds.css?v=20261120dnd1" />
  <title>KG Kitchen Display</title>
  <style>.hidden{display:none!important}</style>
  <script>
    // Early standalone detect so CSS/keyboard path works before app.js loads
    (function () {
      try {
        var hs = navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches;
        if (hs) {
          document.documentElement.classList.add("kds-standalone");
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("kds-standalone");
          });
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="kds-body kds-login-open">
  <div id="kdsLogin" class="kds-login">
    <h1 id="loginTitle">किचन लॉगिन</h1>
    <p id="loginHint">मैनेजर अकाउंट से साइन इन करें</p>
    <form id="kdsLoginForm" class="kds-login-form" action="#" method="post" autocomplete="on">
      <label class="kds-field-label" for="kdsEmail">ईमेल</label>
      <input
        id="kdsEmail"
        name="email"
        type="email"
        inputmode="email"
        enterkeyhint="next"
        autocomplete="username"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="ईमेल"
        required
      />
      <label class="kds-field-label" for="kdsPassword">पासवर्ड</label>
      <input
        id="kdsPassword"
        name="password"
        type="password"
        inputmode="text"
        enterkeyhint="go"
        autocomplete="current-password"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="पासवर्ड"
        required
      />
      <button type="submit" id="kdsSignInBtn">साइन इन</button>
    </form>
    <div id="kdsLoginError" class="kds-error"></div>
  </div>

  <div id="kdsApp" class="hidden" style="display:none;flex-direction:column;flex:1;min-height:0;">
    <header class="kds-top">
      <div class="kds-brand" id="kdsBrand">किचन डिस्प्ले</div>
      <div class="kds-conn" id="kdsConn">ऑनलाइन</div>
      <div id="kdsSoundTip" style="font-size:13px;font-weight:700;color:#ffd666;">🔊 आवाज़ के लिए एक बार टैप करें</div>
      <button type="button" id="kdsBeepBtn">बीप</button>
      <button type="button" id="kdsLangBtn">English</button>
      <button type="button" id="kdsLogoutBtn">लॉग आउट</button>
    </header>

    <main id="kdsBoard" class="kds-board" aria-live="polite"></main>
    <div id="kdsFlash" class="kds-flash" role="status" aria-live="assertive"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/kds/i18n.js?v=20261119fast1"></script>
  <script src="js/kds/audio.js?v=20261119fast1"></script>
  <script src="js/kds/offline.js?v=20261119fast1"></script>
  <script src="js/kds/kdsStore.js?v=20261119fast1"></script>
  <script src="js/kds/board.js?v=20261120dnd1"></script>
  <script src="js/kds/app.js?v=20261120dnd1"></script>
</body>
</html>
