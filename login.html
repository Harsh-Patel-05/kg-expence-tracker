<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — The Kilogram</title>
  <link rel="stylesheet" href="css/design-system.css?v=20261123brand1" />
  <link rel="stylesheet" href="css/premium-theme.css?v=20261123brand1" />
  <link rel="stylesheet" href="css/auth.css?v=20261123brand1" />
  <script src="js/theme.js?v=20260710g"></script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <aside class="auth-brand" aria-hidden="false">
      <div class="auth-brand-inner">
        <img src="assets/the-kilogram-logo.png" alt="The Kilogram" class="auth-logo" />
        <p class="auth-tagline">Restaurant ERP — sales, stock, staff &amp; cash in one place.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tabLogin" onclick="showAuthTab('login')">Sign in</button>
          <button type="button" class="auth-tab" id="tabRegister" onclick="showAuthTab('register')">Register</button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="return onLoginSubmit(event)">
          <h1 class="auth-heading">Welcome back</h1>
          <p class="auth-sub">Sign in with your kitchen account</p>
          <label class="label">Email</label>
          <input class="input" type="email" id="loginEmail" required autocomplete="username" placeholder="you@kilogram.com" />
          <label class="label">Password</label>
          <input class="input" type="password" id="loginPassword" required autocomplete="current-password" minlength="6" placeholder="••••••••" />
          <p class="auth-error" id="loginError" hidden></p>
          <button class="btn auth-submit" type="submit" id="loginBtn">Sign in</button>
        </form>

        <form id="registerForm" class="auth-form" hidden onsubmit="return onRegisterSubmit(event)">
          <h1 class="auth-heading">Create account</h1>
          <p class="auth-sub">First account becomes <strong>Owner</strong>. Later accounts pick a role.</p>
          <label class="label">Full name</label>
          <input class="input" type="text" id="regName" required autocomplete="name" placeholder="Mihir" />
          <label class="label">Email</label>
          <input class="input" type="email" id="regEmail" required autocomplete="email" placeholder="you@kilogram.com" />
          <label class="label">Password</label>
          <input class="input" type="password" id="regPassword" required autocomplete="new-password" minlength="6" placeholder="Min 6 characters" />
          <label class="label">Role</label>
          <select class="input" id="regRole">
            <option value="owner">Owner</option>
            <option value="manager">Manager</option>
            <option value="kitchen">Kitchen</option>
            <option value="accountant">Accountant</option>
            <option value="employee">Employee</option>
          </select>
          <p class="auth-error" id="regError" hidden></p>
          <button class="btn auth-submit" type="submit" id="regBtn">Create account</button>
        </form>
      </div>
      <p class="auth-foot">The Kilogram · Secure multi-user access</p>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js?v=20260810p1"></script>
  <script>
    function showAuthTab(tab) {
      const login = tab === "login";
      document.getElementById("loginForm").hidden = !login;
      document.getElementById("registerForm").hidden = login;
      document.getElementById("tabLogin").classList.toggle("active", login);
      document.getElementById("tabRegister").classList.toggle("active", !login);
    }

    function mapAuthError(e) {
      const c = e?.code || "";
      if (c === "auth/operation-not-allowed")
        return "Email/Password login is disabled in Firebase. Enable it under Authentication → Sign-in method.";
      if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found")
        return "Invalid email or password";
      if (c === "auth/email-already-in-use") return "Email already registered — sign in instead";
      if (c === "auth/weak-password") return "Password must be at least 6 characters";
      if (c === "auth/invalid-email") return "Enter a valid email";
      if (c === "auth/too-many-requests") return "Too many attempts — try again later";
      return e?.message || "Something went wrong";
    }

    async function onLoginSubmit(ev) {
      ev.preventDefault();
      const err = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        await window.KgAuth.login(
          document.getElementById("loginEmail").value,
          document.getElementById("loginPassword").value
        );
        const next = new URLSearchParams(location.search).get("next") || "index.html";
        location.replace(next);
      } catch (e) {
        err.textContent = mapAuthError(e);
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
      return false;
    }

    async function onRegisterSubmit(ev) {
      ev.preventDefault();
      const err = document.getElementById("regError");
      const btn = document.getElementById("regBtn");
      err.hidden = true;
      btn.disabled = true;
      btn.textContent = "Creating…";
      try {
        const res = await window.KgAuth.register({
          email: document.getElementById("regEmail").value,
          password: document.getElementById("regPassword").value,
          displayName: document.getElementById("regName").value,
          role: document.getElementById("regRole").value
        });
        if (res.isFirstUser) {
          /* first user forced Owner */
        }
        location.replace("index.html");
      } catch (e) {
        err.textContent = mapAuthError(e);
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Create account";
      }
      return false;
    }
  </script>
</body>
</html>
